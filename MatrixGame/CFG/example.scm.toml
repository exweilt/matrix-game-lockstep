# Optional scenario / game rules (copy to example.scm.toml next to MatrixGame.exe).
# Applied after cfg/robots/data.txt — overrides those values when enabled.

[scm]
enabled = true

[game_settings]
robot_construction_time = 2.0
turret_construction_time = 15.0
# Seconds for a robot to fill all capture points (0 -> fully captured).
factory_capture_time = 8.0

income_period_titanium = 7.0
income_period_electronics = 7.0
income_period_energy = 7.0
income_period_plasma = 7.0
income_period_base = 7.0

income_base = 5
income_titanium = 3
income_electronics = 3
income_energy = 3
income_plasma = 3

friendly_fire_modifier = 1.0
# Max robots on map: sum over your bases/factories (see GetMaxSideRobots).
robot_capacity_bonus_per_factory = 5
robot_capacity_bonus_per_base = 5
# Max build queue slots at each base (separate from map robot cap).
base_robot_queue_capacity = 6

# Max HP (internal units; UI shows HP/10). Vanilla from data.txt Building HITPOINT:
# base 50000, each factory type 30000.
base_health = 50000
factory_health = 30000

starting_titanium = 0
starting_electronics = 0
starting_energy = 0
starting_plasma = 0

# Robots presets (palette) — place robots.palette.toml next to MatrixGame.exe (not in CFG/).
# TOML allows only one value per key per table; list all guns in a weapons array.

[[robot_preset]] # Classic Attacker
chassis = "antigravs"
hull = "fullstack"
head = "dynamo"
weapons = ["rocket_launcher", "rocket_launcher", "cannon", "discharger", "grenade_launcher"]

[[robot_preset]] # Classic Support
chassis = "antigravs"
hull = "fullstack"
head = "dynamo"
weapons = ["repair_tool", "repair_tool", "repair_tool", "repair_tool"]

[[robot_preset]] # Cheap force
chassis = "hovercraft"
hull = "diploid"
head = "dynamo"
weapons = ["cannon", "cannon"]
